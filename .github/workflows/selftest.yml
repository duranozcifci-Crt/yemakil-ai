name: Öz-denetim
on:
  push:
  pull_request:
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright kurulumu
        run: |
          npm install --no-save playwright@1.63.0
          # Ubuntu paket sunucusuna ulaşılamazsa (geçici DNS hatası) yeniden dene; olmazsa yalnız tarayıcıyı kur
          npx playwright install --with-deps chromium || { sleep 30; npx playwright install --with-deps chromium; } || { echo "::warning::Sistem paketleri kurulamadı; yalnız tarayıcı kuruluyor"; npx playwright install chromium; }
      - name: Asıl sürüm (index.html)
        run: node test/selftest.js index.html
      - name: Fiyatlar sayfası (fiyat.html)
        run: node test/sayfalar.js fiyat.html
      - name: Sipariş sayfası (siparis.html)
        run: node test/sayfalar.js siparis.html
      - name: Giriş sayfası (yemakil.html)
        run: node test/sayfalar.js yemakil.html
      - name: Deneme sürümü (deneme/index.html)
        run: if [ -f deneme/index.html ]; then node test/selftest.js deneme/index.html; else echo "deneme sürümü yok"; fi
