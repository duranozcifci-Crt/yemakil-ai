name: Fiyat panosu
on:
  schedule:
    - cron: "17 22 * * 1-5"
    # motorin (nakliye hesabı) hafta sonu da değişebilir: her sabah 07:17 (TR) bir kez daha
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
# Aynı anda iki güncelleme çalışmasın (ikincisi birincinin bitmesini bekler)
concurrency:
  group: fiyat-panosu
  cancel-in-progress: false
jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PDF okuyucu (USDA raporu için)
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Fiyatları çek
        # betik her isteğe 25 sn, yavaş döngülere toplam 7 dk sınır koyar ve o ana kadar çekileni yazar
        timeout-minutes: 11
        run: node tools/fiyat_guncelle.mjs fiyatlar.json
      - name: Kaydet
        run: |
          git config user.name "yemakil-fiyat"
          git config user.email "yemakil-fiyat@users.noreply.github.com"
          git add fiyatlar.json fiyat-arsiv.json
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -m "Fiyat panosu: $(date -u +%Y-%m-%d)"
          # bu arada main'e başka bir birleştirme olduysa önce onu al, sonra gönder (3 deneme)
          for i in 1 2 3; do
            if git pull --rebase origin "${GITHUB_REF_NAME:-main}" && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "gönderilemedi"; exit 1
