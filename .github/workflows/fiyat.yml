name: Fiyat panosu
on:
  schedule:
    - cron: "17 22 * * 1-5"
    # motorin (nakliye hesabı) hafta sonu da değişebilir: her sabah 07:17 (TR) bir kez daha
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PDF okuyucu (USDA raporu için)
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
      - name: Fiyatları çek
        run: node tools/fiyat_guncelle.mjs fiyatlar.json
      - name: Kaydet
        run: |
          if git diff --quiet -- fiyatlar.json && git ls-files --error-unmatch fiyatlar.json >/dev/null 2>&1; then echo "değişiklik yok"; exit 0; fi
          git config user.name "yemakil-fiyat"
          git config user.email "yemakil-fiyat@users.noreply.github.com"
          git add fiyatlar.json
          git commit -m "Fiyat panosu: $(date -u +%Y-%m-%d)"
          git push
