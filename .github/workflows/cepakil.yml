name: CepAkıl Android derlemesi
on:
  push:
    paths:
      - "cepakil/**"
      - ".github/workflows/cepakil.yml"
  pull_request:
    paths:
      - "cepakil/**"
      - ".github/workflows/cepakil.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cepakil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Birim testleri
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Hata ayıklama APK'sı
        run: ./gradlew --no-daemon assembleDebug
      - name: Android Lint
        run: ./gradlew --no-daemon lintDebug
      # Söz denetimi: APK'da internet izni olmamalı (kütüphaneler gizlice eklemesin).
      # Söz: kişisel verilere erişen izinler (SMS, kişiler, konum, kamera, mikrofon, depolama...) asla istenmez.
      - name: Gereksiz izin yok mu?
        run: |
          AAPT2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/debug/app-debug.apk | tee izinler.txt
          for IZIN in READ_SMS RECEIVE_SMS SEND_SMS READ_CONTACTS WRITE_CONTACTS READ_CALL_LOG READ_PHONE_STATE ACCESS_FINE_LOCATION \
                      ACCESS_COARSE_LOCATION ACCESS_BACKGROUND_LOCATION CAMERA RECORD_AUDIO READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE \
                      MANAGE_EXTERNAL_STORAGE READ_MEDIA_IMAGES READ_MEDIA_VIDEO BIND_ACCESSIBILITY_SERVICE BIND_DEVICE_ADMIN GET_ACCOUNTS; do
            if grep -q "android.permission.$IZIN'" izinler.txt; then echo "::error::APK gereksiz izin içeriyor: $IZIN"; exit 1; fi
          done
      # Tehdit listeleri hâlâ yayında ve beklenen biçimde mi? (Uyarı verir, derlemeyi durdurmaz.)
      - name: Tehdit listeleri erişilebilir mi?
        continue-on-error: true
        run: |
          for U in https://www.usom.gov.tr/url-list.txt https://openphish.com/feed.txt \
                   https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-hosts.txt \
                   https://malware-filter.gitlab.io/malware-filter/phishing-filter-hosts.txt; do
            N=$(curl -sfL --max-time 60 "$U" | grep -vc '^#' || true)
            echo "$U -> $N satır"
            if [ "${N:-0}" -lt 5 ]; then echo "::warning::Tehdit listesi boş ya da erişilemiyor: $U"; fi
          done
      # Sanal telefonda uçtan uca deneme (kurulum, tarama, kaldırma, mesaj kontrolü).
      - name: Sanal telefon için KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Sanal telefonda uçtan uca testler
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: cepakil
          script: |
            adb install -r ornek/build/outputs/apk/debug/ornek-debug.apk
            ./gradlew --no-daemon connectedDebugAndroidTest -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true; S=$?; mkdir -p cihaz-ekran; (adb exec-out run-as com.cepakil tar -c -C files ekran > cihaz-ekran.tar && tar -xf cihaz-ekran.tar -C cihaz-ekran) || true; adb logcat -d -v time > cihaz-ekran/logcat.txt || true; adb shell pm list packages -3 > cihaz-ekran/paketler.txt || true; exit $S
      # Yalnız elle başlatılınca: APK'yı aynı dala ekler (sohbetten doğrudan göndermek için).
      - name: APK'yı dala ekle
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p indir ekran
          cp app/build/outputs/apk/debug/app-debug.apk indir/CepAkil.apk
          # Tasarım ekran görüntüleri (başarısız olsa da APK eklenir)
          if ./gradlew --no-daemon recordPaparazziDebug -Pgoruntu; then
            rm -f ekran/*.png; cp app/src/test/snapshots/images/*.png ekran/ || true
            git add ekran
          else
            echo "::warning::Ekran görüntüleri üretilemedi"
          fi
          git clean -fdq app/src/test/snapshots || true
          # Sanal telefondan alınan gerçek ekran görüntüleri
          if ls cihaz-ekran/ekran/*.png >/dev/null 2>&1; then cp cihaz-ekran/ekran/*.png ekran/; git add ekran; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indir/CepAkil.apk
          git commit -m "CepAkıl APK (otomatik)"
          git push origin HEAD:${{ github.ref_name }}
      # Elle başlatılmış derlemede testler başarısız olursa: kanıtları (ekran görüntüsü, rapor, logcat) dala ekle.
      - name: Hata kanıtlarını dala ekle
        if: failure() && github.event_name == 'workflow_dispatch'
        run: |
          rm -rf hata && mkdir -p hata
          cp -r cihaz-ekran/* hata/ 2>/dev/null || true
          find app/build/outputs/androidTest-results -name "*.xml" -exec cp {} hata/ \; 2>/dev/null || true
          if [ -f hata/logcat.txt ]; then grep -E "cepakil|AndroidRuntime|FATAL|TestRunner" hata/logcat.txt | tail -n 400 > hata/logcat-ozet.txt; rm hata/logcat.txt; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f hata
          git commit -m "CepAkıl test hatası kanıtları (otomatik)" || exit 0
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cepakil-debug-apk
          path: cepakil/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cepakil-raporlar
          path: |
            cepakil/cihaz-ekran/
            cepakil/app/build/outputs/androidTest-results/
            cepakil/app/build/reports/
            cepakil/app/build/test-results/
          if-no-files-found: ignore
