name: CepAkıl Android derlemesi
on:
  push:
    paths:
      - "cepakil/**"
      - ".github/workflows/cepakil.yml"
  pull_request:
    paths:
      - "cepakil/**"
      - ".github/workflows/cepakil.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cepakil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Birim testleri
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Hata ayıklama APK'sı
        run: ./gradlew --no-daemon assembleDebug
      - name: Android Lint
        run: ./gradlew --no-daemon lintDebug
      # Yalnız elle başlatılınca: APK'yı aynı dala ekler (sohbetten doğrudan göndermek için).
      - name: APK'yı dala ekle
        if: github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p indir
          cp app/build/outputs/apk/debug/app-debug.apk indir/CepAkil.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add indir/CepAkil.apk
          git commit -m "CepAkıl APK (otomatik)"
          git push origin HEAD:${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cepakil-debug-apk
          path: cepakil/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cepakil-raporlar
          path: |
            cepakil/app/build/reports/
            cepakil/app/build/test-results/
          if-no-files-found: ignore
