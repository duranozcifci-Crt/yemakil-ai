name: CepAkıl Android derlemesi
on:
  push:
    paths:
      - "cepakil/**"
      - ".github/workflows/cepakil.yml"
  pull_request:
    paths:
      - "cepakil/**"
      - ".github/workflows/cepakil.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cepakil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Birim testleri
        run: ./gradlew --no-daemon testDebugUnitTest -Psurum=${{ github.run_number }}
      # Deneme (debug) ve kullanıcıya giden küçültülmüş yayın (release) sürümü; ikisi de depodaki sabit anahtarla imzalanır.
      - name: APK'lar (deneme + yayın)
        run: ./gradlew --no-daemon assembleDebug assembleRelease -Psurum=${{ github.run_number }}
      - name: Android Lint
        run: ./gradlew --no-daemon lintDebug -Psurum=${{ github.run_number }}
      # Söz denetimi: APK'da internet izni olmamalı (kütüphaneler gizlice eklemesin).
      # Söz: kişisel verilere erişen izinler (SMS, kişiler, konum, kamera, mikrofon, depolama...) asla istenmez.
      - name: Gereksiz izin yok mu?
        run: |
          AAPT2="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2"
          "$AAPT2" dump permissions app/build/outputs/apk/release/app-release.apk | tee izinler.txt
          for IZIN in READ_SMS RECEIVE_SMS SEND_SMS READ_CONTACTS WRITE_CONTACTS READ_CALL_LOG READ_PHONE_STATE ACCESS_FINE_LOCATION \
                      ACCESS_COARSE_LOCATION ACCESS_BACKGROUND_LOCATION CAMERA RECORD_AUDIO READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE \
                      MANAGE_EXTERNAL_STORAGE READ_MEDIA_IMAGES READ_MEDIA_VIDEO BIND_ACCESSIBILITY_SERVICE BIND_DEVICE_ADMIN GET_ACCOUNTS; do
            if grep -q "android.permission.$IZIN'" izinler.txt; then echo "::error::APK gereksiz izin içeriyor: $IZIN"; exit 1; fi
          done
          # Play Protect, dosyadan kurulan ve bildirim/erişilebilirlik hizmeti tanımlayan uygulamaları engeller.
          "$AAPT2" dump xmltree --file AndroidManifest.xml app/build/outputs/apk/release/app-release.apk > manifest.txt
          for H in BIND_NOTIFICATION_LISTENER_SERVICE BIND_ACCESSIBILITY_SERVICE; do
            if grep -q "android.permission.$H" manifest.txt; then echo "::error::APK Play Protect engeline takılacak hizmet içeriyor: $H"; exit 1; fi
          done
      # Tehdit listeleri hâlâ yayında ve beklenen biçimde mi? (Uyarı verir, derlemeyi durdurmaz.)
      - name: Tehdit listeleri erişilebilir mi?
        continue-on-error: true
        run: |
          for U in https://www.usom.gov.tr/url-list.txt https://openphish.com/feed.txt \
                   https://malware-filter.gitlab.io/malware-filter/urlhaus-filter-hosts.txt \
                   https://malware-filter.gitlab.io/malware-filter/phishing-filter-hosts.txt; do
            N=$(curl -sfL --max-time 60 "$U" | grep -vc '^#' || true)
            echo "$U -> $N satır"
            if [ "${N:-0}" -lt 5 ]; then echo "::warning::Tehdit listesi boş ya da erişilemiyor: $U"; fi
          done
      # Sanal telefonda uçtan uca deneme (kurulum, tarama, kaldırma, mesaj kontrolü).
      - name: Sanal telefon için KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Sanal telefonda uçtan uca testler
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: cepakil
          script: |
            adb install -r ornek/build/outputs/apk/debug/ornek-debug.apk
            ./gradlew --no-daemon connectedDebugAndroidTest -Psurum=${{ github.run_number }} -Pandroid.injected.androidTest.leaveApksInstalledAfterRun=true; S=$?; mkdir -p cihaz-ekran; (adb exec-out run-as com.cepakil tar -c -C files ekran > cihaz-ekran.tar && tar -xf cihaz-ekran.tar -C cihaz-ekran) || true; adb logcat -d -v time > cihaz-ekran/logcat.txt || true; adb shell pm list packages -3 > cihaz-ekran/paketler.txt || true; exit $S
            adb logcat -c || true
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n com.cepakil/.MainActivity
            sleep 12; mkdir -p cihaz-ekran/ekran; adb shell pidof com.cepakil || { echo "Yayın sürümü açılmadı"; exit 1; }; adb exec-out screencap -p > cihaz-ekran/ekran/10_yayin_surumu.png; adb logcat -d -v time | grep -E "FATAL EXCEPTION|AndroidRuntime: " > cihaz-ekran/yayin-cokme.txt; if [ -s cihaz-ekran/yayin-cokme.txt ] && grep -q "com.cepakil" cihaz-ekran/yayin-cokme.txt; then echo "Yayın sürümü çöktü"; cat cihaz-ekran/yayin-cokme.txt; exit 1; fi
      - name: Tasarım ekran görüntüleri
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: ./gradlew --no-daemon recordPaparazziDebug -Pgoruntu -Psurum=${{ github.run_number }}
      # Yalnız elle başlatılınca: başarılı derlemenin APK'sı ve ekran görüntüleri "cepakil-cikti" dalına,
      # başarısız derlemenin kanıtları "cepakil-hata" dalına TEK commit olarak yazılır (eskisinin üzerine).
      # Uygulama içi "yeni sürüm" denetimi cepakil-cikti/durum.txt dosyasını okur; bu yüzden o dal yalnız
      # testlerden geçmiş sürümü taşır.
      - name: Çıktıları yayınla (cepakil-cikti / cepakil-hata dalı)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          C="$RUNNER_TEMP/cikti"; rm -rf "$C"; mkdir -p "$C/ekran"
          echo "${{ github.sha }} ${{ job.status }} 0.2.${{ github.run_number }}" > "$C/durum.txt"
          cp cihaz-ekran/ekran/*.png "$C/ekran/" 2>/dev/null || true
          if [ "${{ job.status }}" = "success" ]; then
            cp app/build/outputs/apk/release/app-release.apk "$C/CepAkil.apk"
            cp app/src/test/snapshots/images/*.png "$C/ekran/" 2>/dev/null || true
          else
            mkdir -p "$C/hata"
            find app/build/outputs/androidTest-results -name "*.xml" -exec cp {} "$C/hata/" \; 2>/dev/null || true
            cp cihaz-ekran/paketler.txt cihaz-ekran/yayin-cokme.txt "$C/hata/" 2>/dev/null || true
            if [ -f cihaz-ekran/logcat.txt ]; then grep -E "cepakil|AndroidRuntime|FATAL|TestRunner" cihaz-ekran/logcat.txt | tail -n 400 > "$C/hata/logcat-ozet.txt"; fi
          fi
          cd "$C"
          git init -q
          DAL=cepakil-cikti; if [ "${{ job.status }}" != "success" ]; then DAL=cepakil-hata; fi
          git checkout -q --orphan "$DAL"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CepAkıl derleme çıktısı (otomatik)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/$DAL"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cepakil-apk
          path: cepakil/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cepakil-raporlar
          path: |
            cepakil/cihaz-ekran/
            cepakil/app/build/outputs/androidTest-results/
            cepakil/app/build/reports/
            cepakil/app/build/test-results/
          if-no-files-found: ignore
