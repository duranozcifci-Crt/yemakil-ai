name: CepKalkan Android derlemesi
on:
  push:
    paths:
      - "cepkalkan/**"
      - ".github/workflows/cepkalkan.yml"
  pull_request:
    paths:
      - "cepkalkan/**"
      - ".github/workflows/cepkalkan.yml"
  workflow_dispatch:
jobs:
  derle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cepkalkan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Birim testleri
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Hata ayıklama APK'sı
        run: ./gradlew --no-daemon assembleDebug
      - name: Android Lint
        run: ./gradlew --no-daemon lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cepkalkan-debug-apk
          path: cepkalkan/app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cepkalkan-raporlar
          path: |
            cepkalkan/app/build/reports/
            cepkalkan/app/build/test-results/
          if-no-files-found: ignore
