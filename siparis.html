<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sipariş"><meta name="format-detection" content="telephone=no">

<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eee9;--card:#fbfcfb;--tx:#16251c;--mu:#5b6b60;--ac:#1d5c4a;--on:#fff;--bd:#cbd5cd;--bad:#a8281f;--ok:#1d6b3a;--wa:#a86a00;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--card:#1a241f;--tx:#e6ede8;--mu:#93a499;--ac:#5fc4a0;--on:#0b1511;--bd:#2c3a32;--bad:#f0877e;--ok:#7fd49a;--wa:#e8b04a}}
:root[data-theme="dark"]{--bg:#111815;--card:#1a241f;--tx:#e6ede8;--mu:#93a499;--ac:#5fc4a0;--on:#0b1511;--bd:#2c3a32;--bad:#f0877e;--ok:#7fd49a;--wa:#e8b04a}
*,*:before,*:after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.45 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
main{max-width:640px;margin:0 auto;padding:16px 14px calc(40px + env(safe-area-inset-bottom,0px))}
h1{position:sticky;top:0;z-index:15;margin:-16px -14px 12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;background:#fff;color:#111;border-bottom:1px solid #e3e3e3;font-size:18px;font-weight:600;letter-spacing:.2px}
p.s{color:var(--mu);margin:0 0 14px;font-size:13px}
label{display:block;font-size:12px;color:var(--mu)}
input[type=number],input[type=text],input[type=tel],input[type=password]{width:100%;padding:8px 7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit;margin-top:2px;min-width:0}
input[type=number],input[type=text],input[type=tel],input[type=password],select{font-size:16px;min-height:44px}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
select{width:100%;padding:10px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:10px}
button,.ed{min-height:44px;touch-action:manipulation}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.ed{border:0;background:none;color:var(--ac);font:500 14px inherit;font-family:inherit;padding:6px 2px}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font:600 16px inherit;font-family:inherit;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--mu);font-size:12px}
.tot{font-weight:600}
#spPanel{padding:0 0 24px}
</style>
</head>
<body><main>
<h1 aria-label="YemAkıl Sipariş" style="display:flex;align-items:center;gap:10px"><img src="icon-siparis-192.png" width="64" height="64" alt="yemakıl Sipariş" style="border-radius:14px"><a href="yemakil.html" aria-label="YemAkıl: tüm programlar" style="margin-left:auto;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid currentColor;border-radius:999px;font-size:12px;font-weight:500;text-decoration:none;color:inherit;opacity:.85"><img src="icon-yemakil-192.png" width="20" height="20" alt="" style="border-radius:5px;margin:0;background:#000">YemAkıl</a><span style="font-size:11px;font-weight:400;opacity:.75">v197</span></h1>

</main>
<script>
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function f(v,d){if(d===undefined)d=2;return Number(v).toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d})}
function num(v){var x=parseFloat(String(v).replace(",","."));return isNaN(x)?0:x}
function oku(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
/* Sipariş sayfası: kendi kaydı (siparis-v1); ilk açılışta rasyon programındaki eski sipariş verileri (rasyon-v1 → sip) bir kez kopyalanır. */
var SP=oku("siparis-v1"),RS=SP?null:oku("rasyon-v1");
var S={sip:(SP&&SP.sip)||(RS&&RS.sip)||undefined};
function save(){try{localStorage.setItem("siparis-v1",JSON.stringify({sip:S.sip}))}catch(e){if(!window._qWarn){window._qWarn=1;try{alert("Kayıt yapılamadı: tarayıcı depolama alanı dolu veya kapalı.")}catch(x){}}}}
if(!SP&&S.sip)save();
</script>
<script src="siparis.js?v=197"></script>
<script>
spOpen();(function(){var p=document.getElementById('spPanel'),m=document.querySelector('main');if(p&&m)m.appendChild(p)})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script>
</body></html>
