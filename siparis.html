<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#573617"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Sipariş"><meta name="format-detection" content="telephone=no">
<link rel="icon" type="image/png" href="icon-siparis-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon-siparis.png">
<link rel="manifest" href="manifest-siparis.json"><title>YemAkıl Sipariş</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9eee9;--card:#fbfcfb;--tx:#16251c;--mu:#5b6b60;--ac:#1d5c4a;--on:#fff;--bd:#cbd5cd;--bad:#a8281f;--ok:#1d6b3a;--wa:#a86a00;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--card:#1a241f;--tx:#e6ede8;--mu:#93a499;--ac:#5fc4a0;--on:#0b1511;--bd:#2c3a32;--bad:#f0877e;--ok:#7fd49a;--wa:#e8b04a}}
:root[data-theme="dark"]{--bg:#111815;--card:#1a241f;--tx:#e6ede8;--mu:#93a499;--ac:#5fc4a0;--on:#0b1511;--bd:#2c3a32;--bad:#f0877e;--ok:#7fd49a;--wa:#e8b04a}
*,*:before,*:after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.45 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums}
main{max-width:640px;margin:0 auto;padding:16px 14px 40px}
h1{font-size:22px;margin:4px 0 2px;font-weight:600}
h2{font-size:16px;margin:26px 0 10px;font-weight:600}
p.s{color:var(--mu);margin:0 0 14px;font-size:13px}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1;padding:11px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;font:500 15px inherit;font-family:inherit}
.seg button[aria-pressed="true"]{background:var(--ac);color:var(--on);border-color:var(--ac)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;min-width:0}.g>label{min-width:0}.g select,.g input{max-width:100%;box-sizing:border-box}
label{display:block;font-size:12px;color:var(--mu)}
input[type=number],input[type=text]{width:100%;padding:8px 7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit;margin-top:2px;min-width:0}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-bottom:8px}
.fl{background:var(--card);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.fi{border-bottom:1px solid var(--bd)}.fi:last-child{border-bottom:0}
.fr{display:flex;align-items:center;gap:12px;padding:12px}
.fr.off .fn{opacity:.5}
.fr input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac);flex:none;margin:0}
.fn{flex:1;min-width:0}.fn b{display:block;font-weight:500}.fn span{font-size:12px;color:var(--mu)}
.ed{border:0;background:none;color:var(--ac);font:500 14px inherit;font-family:inherit;padding:6px 2px}
.fe{padding:0 12px 12px}
.fe .top{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-bottom:8px}
.fe .top input,.fe .g input{background:var(--bg)}
select{width:100%;padding:10px 8px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--tx);font:inherit;margin-bottom:10px}
.addrow{display:flex;gap:8px;margin-top:8px}.addrow select{margin:0;flex:1;min-width:0}.addrow input{width:84px;margin:0}.addrow button.btn{width:auto;margin:0;padding:0 18px}
.fk{width:84px;margin:0}.u{color:var(--mu);font-size:13px}
details.dt{margin-top:10px}details.dt summary{color:var(--ac);font-weight:500;padding:8px 0}details.dt .g{margin-top:6px}
.nt{margin:4px 0;padding-left:18px;font-size:13px}.nt li{margin-bottom:4px}
#sheet{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.sh{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--bg);border-bottom:1px solid var(--bd)}
.sh b{font-size:17px;font-weight:600}
.shb{max-width:640px;margin:0 auto;padding:12px 14px calc(40px + env(safe-area-inset-bottom,0px))}
.fa{display:grid;grid-template-columns:1fr 64px 64px 28px;gap:8px;align-items:center;padding:10px 12px}
.fa input{margin:0;padding:8px 6px;text-align:right}
.fa .del{padding:4px 0;font-size:16px}
.fh{font-size:12px;color:var(--mu);padding-bottom:6px;border-bottom:1px solid var(--bd)}.fh span:not(:first-child){text-align:right}
.fa{grid-template-columns:1fr 58px 58px 20px;gap:6px;padding:8px 12px}
.fa input{padding:6px 2px;background:transparent;border:0;border-bottom:1px solid var(--bd);border-radius:0;font-size:15px}
.fa .del{color:var(--mu);font-size:13px;padding:4px 0;text-align:center}
.fa .fn b{font-size:14px;font-weight:500;line-height:1.25}
.fa .fn span{font-size:11px}
.fr{gap:10px;padding:9px 12px}.fn b{font-size:14px}
#open{background:transparent;border:1px dashed var(--bd);color:var(--ac);font-weight:500;font-size:14px;padding:10px;margin-top:8px}
table.c{font-size:13px}table.c th,table.c td{padding:6px 3px;white-space:nowrap}table.c td:first-child,table.c th:first-child{white-space:normal}
table.c th,table.c td{padding:7px 6px}table.c td:nth-child(3){color:var(--mu);font-size:12px}table.c td:first-child,table.c th:first-child{padding-left:0}table.c td:last-child,table.c th:last-child{padding-right:0}
.sum{display:block;margin:4px 0 10px}
.sum div{display:flex;justify-content:space-between;align-items:baseline;gap:14px;background:none;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:8px 0}
.sum b{order:2;display:block;font-size:15px;font-weight:600;white-space:nowrap}
.sum span{order:1;font-size:13px;color:var(--mu)}
.hd{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.hd input[type=checkbox]{width:20px;height:20px;accent-color:var(--ac);flex:none}
.hd .nm{flex:1}.hd .pr{width:84px;flex:none}
.hd .nm input,.hd .pr input{margin:0}
.del{border:0;background:none;color:var(--bad);font:inherit;font-size:13px;padding:4px 0}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font:600 16px inherit;font-family:inherit;margin-top:14px}
.btn.l{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:500;margin-top:6px;padding:11px}
.bar{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:10px 0 4px;border:1px solid var(--bd)}
.bar i{display:block;min-width:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:7px 4px;border-bottom:1px solid var(--bd);text-align:right}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--mu);font-size:12px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.tot{font-weight:600}
.sum{display:block;margin:4px 0 10px}
.sum div{display:flex;justify-content:space-between;align-items:baseline;gap:14px;background:none;border:0;border-bottom:1px solid var(--bd);border-radius:0;padding:8px 0}
.sum b{order:2;display:block;font-size:15px;font-weight:600;white-space:nowrap}
.sum span{order:1;font-size:13px;color:var(--mu)}
.err{background:var(--card);border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:12px}
.ok{color:var(--ok)}.no{color:var(--bad)}.wa{color:var(--wa)}.rk{border-bottom:1px solid var(--bd);padding:10px 0}.rk h3{margin:0 0 2px;font-size:15px;display:flex;justify-content:space-between;gap:10px}.rk h3 em{font-style:normal;font-weight:600;font-size:13px;white-space:nowrap}.rk small{display:block;color:var(--mu);font-size:12px;margin-top:4px}
.note{font-size:12px;color:var(--mu);margin-top:18px}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body.nonotes .mn,body.nonotes .rk small{display:none}
.ntg{border:0;background:none;color:var(--ac);font:500 13px inherit;font-family:inherit;padding:8px 0;min-height:0}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
main{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
input[type=number],input[type=text],select{font-size:16px;min-height:44px}
.fa input{min-height:40px;font-size:16px}
button,.seg button,.ed{min-height:44px;touch-action:manipulation}
.fa .del{min-width:28px}
.fr input[type=checkbox]{width:24px;height:24px}
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:0 6px env(safe-area-inset-bottom,0px)}
#tabs{padding:0 0 env(safe-area-inset-bottom,0px)}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;color:var(--mu);font:500 11px inherit;font-family:inherit;padding:8px 2px 12px;min-height:60px;line-height:1.3}
#tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-current="true"]{color:var(--ac)}
h1{position:sticky;top:0;z-index:15;margin:-16px -14px 12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;background:var(--ac);color:var(--on);font-size:18px;letter-spacing:.2px}
main>.s:first-of-type{display:none}
#sheet:not([hidden])~#tabs{display:none}
</style><style>#spPanel{position:static!important;width:auto!important;max-width:none!important;box-shadow:none!important;padding:0 0 24px!important;background:transparent!important;overflow:visible!important}#spClose{display:none!important}</style>
</head>
<body><main>
<h1 aria-label="YemAkıl Sipariş" style="display:flex;align-items:center;gap:10px"><img src="icon-siparis-192.png" width="64" height="64" alt="yemakıl Sipariş" style="border-radius:14px"><a href="yemakil.html" aria-label="YemAkıl: tüm programlar" style="margin-left:auto;display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border:1px solid currentColor;border-radius:999px;font-size:12px;font-weight:500;text-decoration:none;color:inherit;opacity:.85"><img src="icon-yemakil-192.png" width="20" height="20" alt="" style="border-radius:5px;margin:0;background:#000">YemAkıl</a><span style="font-size:11px;font-weight:400;opacity:.75">v169</span></h1>

</main>
<script>
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function f(v,d){if(d===undefined)d=2;return Number(v).toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d})}
function num(v){var x=parseFloat(String(v).replace(",","."));return isNaN(x)?0:x}
function oku(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
/* Sipariş sayfası: kendi kaydı (siparis-v1); ilk açılışta rasyon programındaki eski sipariş verileri (rasyon-v1 → sip) bir kez kopyalanır. */
var SP=oku("siparis-v1"),RS=SP?null:oku("rasyon-v1");
var S={sip:(SP&&SP.sip)||(RS&&RS.sip)||undefined};
function save(){try{localStorage.setItem("siparis-v1",JSON.stringify({sip:S.sip}))}catch(e){if(!window._qWarn){window._qWarn=1;try{alert("Kayıt yapılamadı: tarayıcı depolama alanı dolu veya kapalı.")}catch(x){}}}}
if(!SP&&S.sip)save();
</script>
<script src="siparis.js"></script>
<script>
spOpen();(function(){var p=document.getElementById('spPanel'),m=document.querySelector('main');if(p&&m)m.appendChild(p)})();
</script>
<script>if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}</script>
</body></html>
