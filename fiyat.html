<style>
:root{--bg:#e9eee9;--card:#fbfcfb;--tx:#16251c;--mu:#5b6b60;--ac:#1d5c4a;--on:#fff;--bd:#cbd5cd;--bad:#a8281f;--ok:#1d6b3a;--wa:#a86a00;box-sizing:border-box;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--card:#1a241f;--tx:#e6ede8;--mu:#93a499;--ac:#5fc4a0;--on:#0b1511;--bd:#2c3a32;--bad:#f0877e;--ok:#7fd49a;--wa:#e8b04a}}
:root[data-theme="dark"]{--bg:#111815;--card:#1a241f;--tx:#e6ede8;--mu:#93a499;--ac:#5fc4a0;--on:#0b1511;--bd:#2c3a32;--bad:#f0877e;--ok:#7fd49a;--wa:#e8b04a}
*,*:before,*:after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.45 "IBM Plex Sans",system-ui,sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
main{max-width:640px;margin:0 auto;padding:16px 14px calc(40px + env(safe-area-inset-bottom,0px))}
h1{position:sticky;top:0;z-index:15;margin:-16px -14px 12px;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;background:#fff;color:#111;border-bottom:1px solid #e3e3e3;font-size:18px;font-weight:600;letter-spacing:.2px}
p.s{color:var(--mu);margin:0 0 14px;font-size:13px}
.mu{color:var(--mu)}.wa{color:var(--wa)}.nw{white-space:nowrap}.r{text-align:right}
label{display:block;font-size:12px;color:var(--mu)}
input[type=number],input[type=text],input[type=date],input:not([type]),select{width:100%;padding:8px 7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px;min-height:44px;margin-top:2px;min-width:0}
input:focus-visible,button:focus-visible,[role=button]:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
button{min-height:44px;touch-action:manipulation}
.btn{width:100%;padding:14px;border:0;border-radius:10px;background:var(--ac);color:var(--on);font:600 16px inherit;font-family:inherit;margin-top:14px}
.btn.l{background:var(--card);color:var(--tx);border:1px solid var(--bd);font-weight:500;margin-top:6px;padding:11px}
.btn.kb{margin:0;min-height:34px;width:auto;padding:0 12px}.btn.sec{font-weight:700;outline:2px solid currentColor}
.btn.pb{margin:0 0 0 8px;min-height:30px;padding:0 10px;font-size:12px;vertical-align:middle}
.uy{background:var(--card);border:1px solid var(--wa);color:var(--tx);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:13px}
h3.oh{margin:12px 0 4px;font-size:15px}
table{width:100%;border-collapse:collapse}
table.oz{font-size:12px}.oth{text-align:left;font-size:11px;color:var(--mu);font-weight:600;padding:4px 2px}.otd{padding:6px 2px;vertical-align:top;text-align:left;border-top:1px solid var(--bd)}
.ox{overflow-x:auto}
table.c{font-size:12px}table.c th,table.c td{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}table.c th{font-weight:500;color:var(--mu);font-size:12px}
table.c th.r{text-align:right;padding:4px 2px}table.c td:first-child,table.c th:first-child{padding-left:0}table.c td:last-child,table.c th:last-child{padding-right:0}
td.pc{padding:4px 2px;text-align:right;white-space:nowrap}td.pn{color:var(--mu);padding:4px 2px;text-align:right;font-size:10px;line-height:1.1}
td.ic{padding:4px 2px 4px 10px}td.alt,th.alt{padding:0 2px;color:var(--mu);font-size:11px;font-weight:400}
.tf{display:flex;gap:8px;align-items:flex-start}.tform{display:grid;gap:6px;font-size:13px}
.hb{border-bottom:1px solid var(--bd);padding:4px 0}.hbb{cursor:pointer;padding:8px 2px;font-size:14px}
details.dt{margin:6px 0}details.dt summary{color:var(--ac);cursor:pointer;padding:8px 0;font-size:13px}
.nv{display:flex;align-items:center;gap:6px;margin:3px 0}.nv input{width:70px}

<script>
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function f(v,d){if(d===undefined)d=2;return Number(v).toLocaleString("tr-TR",{minimumFractionDigits:d,maximumFractionDigits:d})}
function num(v){var x=parseFloat(String(v).replace(",","."));return isNaN(x)?0:x}
function oku(k){try{var v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}}
/* Fiyatlar sayfası: rasyon kayıtlarından (rasyon-v1) hammadde ve alış fiyatı geçmişi salt-okunur; navlun ayarları ve size gelen teklifler bu sayfanın kendi kaydında (fiyat-v1). */
var RS=oku("rasyon-v1")||{},FS=oku("fiyat-v1")||{};
var S={feeds:Array.isArray(RS.feeds)?RS.feeds:[],ph:(RS.ph&&typeof RS.ph==="object")?RS.ph:{},navlun:FS.navlun||RS.navlun,teklif:Array.isArray(FS.teklif)?FS.teklif:[]};
function save(){try{localStorage.setItem("fiyat-v1",JSON.stringify({navlun:S.navlun,teklif:S.teklif}))}catch(e){}}
</script>
